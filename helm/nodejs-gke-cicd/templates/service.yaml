apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodejs-gke-cicd.fullname" . }}
  labels:
    {{- include "nodejs-gke-cicd.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "nodejs-gke-cicd.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP