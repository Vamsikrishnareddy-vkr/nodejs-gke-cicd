apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-gke-cicd
  labels:
    app: nodejs-gke-cicd

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: nodejs-gke-cicd

  template:
    metadata:
      labels:
        app: nodejs-gke-cicd

    spec:
      containers:
        - name: nodejs-gke-cicd
          image: nodejs-gke-cicd:17
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3